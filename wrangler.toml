name = "beninpublio-api"
main = "src/worker.js"
compatibility_date = "2026-10-14"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "beninpublio-db"
database_id = "e81e3650-f4d6-4207-83a6-9969d9f1e220"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "beninpublio-media"

[vars]
APP_ENV = "production"
AI_ENABLED = "false"
