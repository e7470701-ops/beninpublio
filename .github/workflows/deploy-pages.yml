name: Validate and deploy BeninPublio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check merchant.js
          node --check admin.js
          node --check --input-type=module < src/worker.js
      - name: Test public API contract
        run: node --test tests/*.test.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Pages output
        run: |
          mkdir -p dist
          cp index.html styles.css app.js merchant.html merchant.js admin.html admin.js dist/
      - name: Deploy Worker and Pages when Cloudflare secrets are configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::Deploy skipped. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to GitHub Actions secrets."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.toml
          npx --yes wrangler@4 pages deploy dist --project-name=beninpublio --branch=main
