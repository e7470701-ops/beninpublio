name: Validate BeninPublio V16
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/worker.js
          node --check app.js
          node --check merchant.js
          node --check admin.js
          node --check storefront.js
      - name: Run V16 contract tests
        run: node --test tests/v16-contract.test.mjs
