<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta name="theme-color" content="#075b35"><meta name="description" content="Découvrez cette vitrine, ses produits et ses actualités."><title>Vitrine du commerce</title><link rel="stylesheet" href="styles.css"><style>
.store-hero{padding:34px max(6vw,20px);background:linear-gradient(120deg,#f2f7ec,#fffdf8);border-bottom:1px solid #e8eee8}.store-head{max-width:1200px;margin:auto;display:flex;align-items:center;gap:18px}.store-logo{width:82px;height:82px;flex:0 0 82px;border-radius:20px;object-fit:cover;background:#e5efe1;border:1px solid #dce7d8}.store-logo-fallback{display:grid;place-items:center;font:800 34px Manrope;color:#075b35}.store-title{font:800 clamp(28px,4vw,46px) Manrope;letter-spacing:-1.8px;margin:0 0 8px}.store-description{color:#65736a;line-height:1.7;font-size:14px;max-width:760px;margin:0}.store-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:12px;color:#47584b}.store-meta a{color:#075b35;font-weight:800}.store-toolbar{max-width:1200px;margin:26px auto 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.store-toolbar .search{width:min(360px,100%)}.store-section{padding:34px max(6vw,20px);max-width:1400px;margin:auto}.store-section h2{font-size:clamp(24px,3vw,34px);margin-bottom:8px}.store-section .section-intro{font-size:13px;color:#65736a;margin-bottom:22px}.store-products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.store-product{border:1px solid #e8eee8;border-radius:13px;overflow:hidden;background:#fff}.store-product img{width:100%;height:190px;object-fit:cover;display:block;background:#edf5e9}.store-product .no-image{height:190px;display:grid;place-items:center;background:#edf5e9;font-size:56px}.store-product-body{padding:15px}.store-product h3{font:800 15px Manrope;margin:7px 0}.store-product p{font-size:12px;color:#65736a;line-height:1.6;white-space:pre-wrap}.store-product-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.store-price{font-size:15px;color:#075b35;font-weight:800}.store-add{border:0;border-radius:8px;background:#075b35;color:white;width:38px;height:38px;font-size:22px;cursor:pointer}.store-news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.store-post{border:1px solid #e8eee8;border-radius:13px;overflow:hidden;background:#fff}.store-post img{width:100%;height:170px;object-fit:cover;display:block}.store-post-body{padding:16px}.store-post h3{font:800 16px Manrope;margin:0 0 10px}.store-post p{font-size:13px;line-height:1.7;white-space:pre-wrap;color:#65736a}.store-muted{color:#65736a;font-size:13px;line-height:1.7}.store-footer{padding:28px max(6vw,20px);background:#f1f5ec;border-top:1px solid #e8eee8;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:12px;color:#65736a}.store-footer strong{color:#075b35}.store-qr{width:86px;height:86px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}.store-contact{display:flex;align-items:center;gap:12px;margin-left:auto}.store-whatsapp{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:9px;background:#075b35;color:#fff;font-size:12px;font-weight:800}.store-disclaimer{margin:0;padding:12px max(6vw,20px);background:#fff8e8;color:#6e551a;font-size:12px;text-align:center}.store-empty{padding:32px;background:#f7f8f3;border-radius:12px;color:#65736a;font-size:13px;grid-column:1/-1}.store-drawer{position:fixed;inset:0;background:#071e12a8;z-index:30;display:none;justify-content:flex-end}.store-drawer.open{display:flex}.store-drawer-panel{width:min(430px,100%);height:100%;overflow:auto;background:white;padding:24px}.store-drawer-head{display:flex;justify-content:space-between;align-items:center}.store-drawer-head h2{font-size:24px}.store-cart-line{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #e8eee8}.store-cart-line .details{flex:1;font-size:12px}.store-cart-line small{display:block;color:#65736a;margin-top:4px}.store-qty{display:flex;gap:8px;align-items:center}.store-qty button{background:white;border:1px solid #dce5d9;border-radius:6px;width:26px;height:26px}.store-cart-total{display:flex;justify-content:space-between;padding:22px 0;font-weight:800}.store-checkout{width:100%;margin-top:12px}.store-message{padding:12px;background:#f1f5ec;border-radius:9px;font-size:12px;line-height:1.7;color:#65736a}.store-hidden{display:none!important}.store-error{padding:80px 22px;text-align:center;max-width:700px;margin:auto}.store-error h1{font-size:35px}.store-error p{color:#65736a;line-height:1.7}.store-error a{display:inline-flex;margin-top:12px}.store-top{height:66px;display:flex;justify-content:space-between;align-items:center;padding:0 max(6vw,20px);background:white;border-bottom:1px solid #e8eee8}.store-top .store-brand{font:800 13px Manrope;color:#075b35}.store-cart-open{border:0;border-radius:28px;padding:10px 14px;background:#edf5e9;color:#075b35;font-weight:800;cursor:pointer}.store-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#143d27;color:white;padding:12px 18px;border-radius:9px;font-size:12px;z-index:50;display:none;max-width:90vw}.store-toast.show{display:block}
